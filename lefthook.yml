# Git hooks. Installed by `npm install` (prepare script). https://lefthook.dev/

pre-commit:
    parallel: true
    commands:
        lint:
            glob: "*.{ts,js,mjs}"
            run: npx eslint --no-warn-ignored --fix {staged_files}
            stage_fixed: true
        format:
            glob: "*.{ts,js,mjs,json,css,yml,yaml}"
            run: npx prettier --write --ignore-unknown {staged_files}
            stage_fixed: true
        typecheck:
            glob: "*.ts"
            run: npm run typecheck

commit-msg:
    commands:
        conventional-commit:
            run: npx commitlint --edit {1}

pre-push:
    piped: true
    commands:
        block-main:
            priority: 1
            run: node scripts/hooks/block-main-push.js
            use_stdin: true
        check:
            priority: 2
            run: npm run build && npm run lint && npm run format:check

skip_output:
    - meta
    - success
