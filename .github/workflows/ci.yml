name: CI

on: [push, pull_request]

jobs:
    main:
        name: Main
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npm run build
            - run: npm run lint
            - run: npm run format:check
